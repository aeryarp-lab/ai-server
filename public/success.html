<script>
    const urlParams = new URLSearchParams(window.location.search);
    const txnId = urlParams.get('txn_id'); 

    if (txnId) {
        let attempts = 0;
        const interval = setInterval(() => {
            fetch(`https://ai-server-seven-mu.vercel.app/api/control?type=get_key&txn_id=${txnId}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    clearInterval(interval);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('key-container').style.display = 'block';
                    document.getElementById('license-key').innerText = data.key;
                    
                    // ⚡ كيرجع المفتاح للتطبيق أوتوماتيكياً ⚡
                    setTimeout(() => {
                        window.location.href = "gvcam://success?key=" + data.key;
                    }, 2000); // كيتسنى ثانيتين باش يشوف المفتاح
                }
                attempts++;
                if (attempts > 10) {
                    clearInterval(interval);
                    document.getElementById('loading').innerText = "تأخر توليد المفتاح، تواصل مع الدعم.";
                }
            }).catch(err => console.log(err));
        }, 2000);
    } else {
        document.getElementById('loading').innerText = "لم يتم العثور على رقم العملية.";
    }

    function copyKey() {
        const key = document.getElementById('license-key').innerText;
        navigator.clipboard.writeText(key).then(() => {
            alert("تم نسخ المفتاح بنجاح! ✅");
        });
    }
</script>
