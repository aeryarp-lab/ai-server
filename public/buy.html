<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G vcam PRO - اشتراك مميز</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: radial-gradient(circle at top, #0a1f14, #000); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 24px; padding: 40px 30px; text-align: center; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
        .logo { font-size: 50px; margin-bottom: 10px; }
        h1 { font-size: 28px; color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.5); margin-bottom: 10px; font-weight: 800; }
        .subtitle { color: #a0a0a0; font-size: 14px; margin-bottom: 25px; }
        .features { background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 15px; margin-bottom: 25px; text-align: right; }
        .features li { list-style: none; margin-bottom: 10px; color: #e0e0e0; font-size: 14px; display: flex; align-items: center; }
        .features li::before { content: '✅'; margin-left: 8px; font-size: 12px; }
        .price { font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 25px; }
        .price span { font-size: 16px; color: #00ff88; font-weight: normal; }
        input[type="submit"] { background: linear-gradient(90deg, #00ff88, #00cc6a); color: #000; border: none; padding: 16px 20px; font-size: 18px; font-weight: bold; border-radius: 50px; width: 100%; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(0, 255, 136, 0.4); }
        .secure { margin-top: 15px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🚀</div>

        <p class="subtitle">النسخة الاحترافية مع جميع الميزات</p>
        <ul class="features">
            <li>فتح جميع الأدوات (HUD, AI...)</li>
            <li>الذكاء الاصطناعي المدمج</li>
            <li>تفعيل فوري لمدة 30 يوم</li>
        </ul>
        <div class="price">$5.00 <span>/ 30 يوم</span></div>
        <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
            <input type="hidden" name="cmd" value="_xclick">
            <input type="hidden" name="business" value="email@domain.com"> <!-- ⚠️ بدل الإيميل ديالك هنا -->
            <input type="hidden" name="item_name" value="G vcam Pro - 30 Days">
            <input type="hidden" name="amount" value="5.00">
            <input type="hidden" name="currency_code" value="USD">
            <input type="hidden" name="notify_url" value="https://ai-server-seven-mu.vercel.app/api/control?type=paypal_ipn">

        </form>
        <div class="secure">🔒 دفع آمن ومشفر عبر PayPal</div>
    </div>
</body>
</html>
