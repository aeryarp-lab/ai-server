<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f1712; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-msg { align-self: flex-end; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000; border-bottom-left-radius: 5px; font-weight: bold; }
        .ai-msg { align-self: flex-start; background: #1e2b24; color: #e0e0e0; border-bottom-right-radius: 5px; border: 1px solid #2a3f33; }
        
        .input-area { display: flex; padding: 10px; background: #15221b; border-top: 1px solid #2a3f33; gap: 10px; }
        input { flex: 1; padding: 12px 15px; border-radius: 25px; border: 1px solid #3a5a47; background: #0a110d; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #00ff88; }
        
        button { background: #00ff88; color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        button:active { transform: scale(0.95); }
        
        .typing { font-size: 12px; color: #888; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div id="chat-box">
        <div class="message ai-msg">أهلاً بك! أنا الذكاء الاصطناعي ديالك. كيفاش نقدر نعاونك اليوم؟ 😊</div>
    </div>
    <div class="typing" id="typing">جاري الكتابة...</div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user-msg' : 'ai-msg');
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const url = `https://ai-server-seven-mu.vercel.app/api/control?type=ai&prompt=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const aiText = await response.text();
                
                typingIndicator.style.display = 'none';
                addMessage(aiText, false);
            } catch (e) {
                typingIndicator.style.display = 'none';
                addMessage("⚠️ وقع خطأ فـ الاتصال بالسيرفر.", false);
            }
        }

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
