<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice & Text Mode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: radial-gradient(circle at 50% 100%, #0a1f44, #020813 70%); color: #fff; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; align-items: center; justify-content: flex-end; padding-bottom: 20px; }
        
        /* منطقة النص المكتوب */
        #text-area { position: absolute; top: 10%; width: 90%; max-height: 45%; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
        .msg { padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.5; max-width: 85%; animation: fadeIn 0.3s ease; }
        .user-msg { align-self: flex-end; background: rgba(0, 255, 136, 0.2); border: 1px solid rgba(0, 255, 136, 0.4); color: #fff; border-bottom-left-radius: 2px; }
        .ai-msg { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #eee; border-bottom-right-radius: 2px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .blob-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; justify-content: center; align-items: center; }
        .blob { width: 150px; height: 90px; background: radial-gradient(circle at bottom, #8ab4f8, #000 80%); border-radius: 50px; box-shadow: 0 0 50px rgba(138, 180, 248, 0.4); transition: all 0.3s ease; }
        .blob.listening { background: radial-gradient(circle at bottom, #00ff88, #000 80%); box-shadow: 0 0 60px rgba(0, 255, 136, 0.6); animation: pulse 1.5s infinite alternate; }
        .blob.speaking { background: radial-gradient(circle at bottom, #8ab4f8, #000 80%); box-shadow: 0 0 80px rgba(138, 180, 248, 0.8); animation: speakPulse 0.5s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        @keyframes speakPulse { 0% { transform: scale(1); border-radius: 60px; } 100% { transform: scale(1.15); border-radius: 40px; } }
        
        .controls { display: flex; gap: 20px; align-items: center; justify-content: center; width: 100%; z-index: 10; }
        .btn { background: #1a1a1a; border: 1px solid #333; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.9); }
        .btn-mic { width: 65px; height: 65px; }
        .btn-mic.recording { background: #ff4444; border-color: #ff4444; animation: pulse 1s infinite; }
        .btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        #status-text { position: absolute; bottom: 110px; font-size: 13px; color: #888; text-align: center; width: 100%; }
    </style>
</head>
<body>
    <!-- شاشة النص -->
    <div id="text-area"></div>

    <div id="status-text">دق على الميكرو باش تبدا المحادثة</div>
    <div class="blob-container"><div class="blob" id="blob"></div></div>
    
    <div class="controls">
        <button class="btn" onclick="window.close()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <button class="btn btn-mic" id="mic-btn" onclick="toggleAutoListen()"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
        <button class="btn" onclick="window.close()"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>

    <script>
        const blob = document.getElementById('blob');
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const textArea = document.getElementById('text-area');

        let isAutoListening = false;
        let isProcessing = false;

        // ⚡ إضافة النص للشاشة ⚡
        function addTextMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'msg ' + (isUser ? 'user-msg' : 'ai-msg');
            div.innerText = text;
            textArea.appendChild(div);
            textArea.scrollTop = textArea.scrollHeight; // كيهبط لتحت أوتوماتيكياً
        }

        function toggleAutoListen() {
            if (isAutoListening) {
                isAutoListening = false;
                micBtn.classList.remove('recording');
                blob.className = 'blob';
                statusText.innerText = "توقفت المحادثة. دق على الميكرو باش تعاود.";
                if (window.Android && window.Android.speak) window.Android.speak("");
            } else {
                isAutoListening = true;
                textArea.innerHTML = ''; // كنمسحو النص القديم ملي نبداو
                startListening();
            }
        }

        function startListening() {
            if (!isAutoListening || isProcessing) return;
            
            statusText.innerText = "جاري الاستماع... (هضر دابا)";
            micBtn.classList.add('recording');
            blob.className = 'blob listening';
            
            if (window.Android && window.Android.startListening) window.Android.startListening();
        }

        function handleVoiceResult(text) {
            micBtn.classList.remove('recording');
            blob.className = 'blob speaking';
            statusText.innerText = "جاري التفكير...";
            addTextMessage(text, true); // كيتكتب اللي هضرتي
            sendToAI(text);
        }

        async function sendToAI(text) {
            isProcessing = true;
            try {
                // ⚡ هنا كيتصل بالسيرفر (خاصك تبدل الرابط إلا بدلتي السيرفر) ⚡
                const url = `https://ai-server-seven-mu.vercel.app/api/control?type=ai&prompt=${encodeURIComponent(text)}`;
                const response = await fetch(url); 
                const aiText = await response.text();
                
                addTextMessage(aiText, false); // كيتكتب الجواب ديال AI

                statusText.innerText = "جاري التحدث...";
                if (window.Android && window.Android.speak) window.Android.speak(aiText);
                
            } catch (e) { 
                isProcessing = false;
                statusText.innerText = "⚠️ وقع خطأ فـ الاتصال.";
                blob.className = 'blob';
                if(isAutoListening) setTimeout(startListening, 2000);
            }
        }

        // ⚡ ملي كيسالي الصوت، كيرجع يسمع ⚡
        function onSpeechFinished() {
            isProcessing = false;
            if (isAutoListening) {
                startListening();
            } else {
                blob.className = 'blob';
                statusText.innerText = "دق على الميكرو باش تهضر";
            }
        }
    </script>
</body>
</html>
