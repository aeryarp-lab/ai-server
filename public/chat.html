<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat & Voice</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f1712; color: #fff; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        /* منطقة الشات */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-msg { align-self: flex-end; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000; border-bottom-left-radius: 5px; font-weight: bold; }
        .ai-msg { align-self: flex-start; background: #1e2b24; color: #e0e0e0; border-bottom-right-radius: 5px; border: 1px solid #2a3f33; }
        
        /* منطقة الكتابة والأزرار */
        .input-area { display: flex; align-items: center; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: #15221b; border-top: 1px solid #2a3f33; gap: 8px; }
        
        input[type="text"] { flex: 1; padding: 12px 15px; border-radius: 25px; border: 1px solid #3a5a47; background: #0a110d; color: #fff; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #00ff88; }
        
        .btn { background: #1a1a1a; color: #00ff88; border: 1px solid #333; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; font-size: 20px; }
        .btn:active { transform: scale(0.9); }
        .btn-send { background: #00ff88; color: #000; border: none; }
        .btn-mic { background: #1a1a1a; color: #fff; }
        .btn-mic.recording { background: #ff4444; color: #fff; border-color: #ff4444; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .typing { font-size: 12px; color: #888; margin-top: 5px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div id="chat-box">
        <div class="message ai-msg">أهلاً بك! أنا الذكاء الاصطناعي ديالك. تقدر تكتب ليا هنا، ولا تدق على الميكرو وتهضر معايا. 😊</div>
    </div>
    <div class="typing" id="typing">جاري التفكير...</div>
    
    <div class="input-area">
        <!-- زر الميكرو -->
        <button class="btn btn-mic" id="mic-btn" onclick="startMic()">🎙️</button>
        
        <!-- خانة الكتابة -->
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        
        <!-- زر الإرسال -->
        <button class="btn btn-send" onclick="sendTextMessage()">➤</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing');
        const micBtn = document.getElementById('mic-btn');

        // ⚡ إضافة رسالة للشات ⚡
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user-msg' : 'ai-msg');
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ⚡ إرسال النص المكتوب ⚡
        function sendTextMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            userInput.value = '';
            sendToAI(text);
        }

        // ⚡ تفعيل الإرسال بزر Enter فـ الكيبورد ⚡
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendTextMessage();
            }
        });

        // ⚡ تشغيل الميكرو ⚡
        function startMic() {
            micBtn.classList.add('recording');
            if (window.Android && window.Android.startListening) {
                window.Android.startListening();
            } else {
                alert("الميكروفون غير متاح.");
                micBtn.classList.remove('recording');
            }
        }

        // ⚡ هادي كترجع من الأندرويد ملي كتسالي تهضر ⚡
        function handleVoiceResult(text) {
            micBtn.classList.remove('recording');
            addMessage(text, true);
            sendToAI(text);
        }

        // ⚡ الاتصال بالسيرفر ديالك ⚡
        async function sendToAI(text) {
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;
            
            try {
                // ⚠️ تأكد من الرابط ديال السيرفر ديالك هنا
                const url = `https://ai-server-seven-mu.vercel.app/api/control?type=ai&prompt=${encodeURIComponent(text)}`;
                const response = await fetch(url); 
                const aiText = await response.text();
                
                typingIndicator.style.display = 'none'; 
                addMessage(aiText, false);
                
                // ⚡ تشغيل الصوت ديال الجواب ⚡
                if (window.Android && window.Android.speak) {
                    window.Android.speak(aiText);
                }
            } catch (e) { 
                typingIndicator.style.display = 'none'; 
                addMessage("⚠️ وقع خطأ فـ الاتصال بالسيرفر.", false); 
            }
        }
    </script>
</body>
</html>
